<div class="dashboard-container">
    <div class="dashboard-header">
        <span class="title">Real-Time Monitoring</span>
        <form id="monitoring-controls">
            <input type="radio" class="chooser" name="data-period" value="1h" />1h
            <input type="radio" class="chooser" name="data-period" value="24h" checked />24h
            <input type="radio" class="chooser" name="data-period" value="7d" />7d
            <input type="radio" class="chooser" name="data-period" value="30d" />30d
        </form>
    </div>

    <div class="monitoring-content">
        <form id="trace-toggles">
            <label><input type="checkbox" name="trace-toggle" value="value" checked />processed</label>
            <label><input type="checkbox" name="trace-toggle" value="raw_value" checked />raw</label>
            <label><input type="checkbox" name="trace-toggle" value="calibrated_value" checked />calibrated</label>
            <label><input type="checkbox" name="trace-toggle" value="normalized_value" checked />normalized</label>
        </form>
        <!-- Driven by Plotly hover over processed-value points. -->
        <div class="dq-status">
            <span>DQ (hover): </span>
            <span id="monitoring-dq-score">—</span>
            <span id="monitoring-flags"></span>
        </div>
        <div class="chart-grid">
            <div class="chart-container">
                <h3>Temperature</h3>
                <div id="temp-chart"></div>
            </div>

            <div class="chart-container">
                <h3>Humidity</h3>
                <div id="humidity-chart"></div>
            </div>

            <div class="chart-container">
                <h3>Soil Moisture</h3>
                <div id="soil-chart"></div>
            </div>

            <div class="chart-container">
                <h3>Light Levels</h3>
                <div id="light-chart"></div>
            </div>
        </div>
    </div>
</div>
