system:
  windows: # window size definitions for rolling calculations
    small_sec: 60
    medium_sec: 300
    big_sec: 1000
  weights: # Data quality scoring weights (must sum to 1.0)
    range_ok: 0.4
    roc_ok: 0.4
    stuck_ok: 0.2

templates:
  # TODO: Make an accuracy field
  dht22.temperature:
    units: "°C"
    # accuracy: 0.5 # +-0.5°C
    validation:
      range: { min: -40, max: 80 }
      roc: { max_per_minute: 1.0 } # Maximum rate of change per minute, in this case it is 1 degree Celsius per minute
      stuck: { max_flat_seconds: 300 } # 5 minutes
    imputation:
      strategy: window_average
      # 2 min sampling → 3-sample window ≈ 6 minutes
      window_seconds: 360
      min_samples: 2
      # retained for schema consistency; not used by window_average
      max_gap_seconds: 480
      decay_seconds: 0
    calibration:
      strategy: affine
      scale: 1.0
      offset: 0.0
    normalization:
      strategy: min_max
      input_min: -40.0
      input_max: 80.0
      output_min: 0.0
      output_max: 1.0
      clip: true

  dht22.humidity:
    units: "%"
    # accuracy: 2.0 # +-2%
    validation:
      range: { min: 0, max: 100 }
      roc: { max_per_minute: 5.0 }
      stuck: { max_flat_seconds: 300 }
    imputation:
      strategy: window_average
      # 2 min sampling → 3-sample window = 6 minutes
      window_seconds: 360
      min_samples: 2
      # retained for schema consistency; not used by window_average
      max_gap_seconds: 480
    calibration:
      strategy: affine
      scale: 1.0
      offset: 0.0
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 100.0
      output_min: 0.0
      output_max: 1.0
      clip: true

  bh1750.lux:
    units: "lux"
    # accuracy: 13107 # +-20% (13107 is 20% of 65535)
    validation:
      range: { min: 1, max: 65535 }
      roc:
        profiles:
          indoor: { max_per_minute: 100 }
          outdoor: { max_per_minute: 1000 }
        active_profile: indoor
      stuck: { max_flat_seconds: 180 }
    imputation:
      strategy: window_average
      # 1 min sampling → 3-sample window = 3 minutes
      window_seconds: 180
      min_samples: 3
      # retained for schema consistency; not used by window_average
      max_gap_seconds: 240
      decay_seconds: 0
    calibration:
      strategy: identity
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 65535.0
      output_min: 0.0
      output_max: 1.0
      clip: true

  stemma.soil_moisture:
    units: "%"
    # accuracy: 40 # +-2% (40 is 2% of 2000)
    validation:
      range: { min: 0, max: 2000 } # Need to be calibrated to 0-100%
      roc:
        profiles:
          normal: { max_per_minute: 5 }
          irrigation: { max_per_minute: 50 }
        active_profile: normal
      stuck: { max_flat_seconds: 600 }  # 10 minutes
    imputation:
      strategy: forward_fill_with_decay
      # 2 min sampling → accept up to ~5 intervals before baseline fallback
      max_gap_seconds: 600
      # decay window for gentle fallback if baseline provided in future
      decay_seconds: 300
      baseline: null
    calibration:
      strategy: affine
      scale: 0.05
      offset: 0.0
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 2000.0
      output_min: 0.0
      output_max: 1.0
      clip: true

sensors:
  # Generic mappings (backward compatibility for lookups by sensor type)
  dht22.temperature: { template: dht22.temperature }
  dht22.humidity: { template: dht22.humidity }
  bh1750.lux: { template: bh1750.lux }
  stemma.soil_moisture: { template: stemma.soil_moisture }

  # Specific sensor overrides
  sensors.basil.dht22.001.temperature:
    template: dht22.temperature
    calibration:
      strategy: affine
      offset: -0.2

  sensors.basil.stemma.001.soil_moisture:
    template: stemma.soil_moisture
    calibration:
      strategy: affine
      scale: 0.047

  sensors.basil.bh1750.001.lux:
    template: bh1750.lux
    normalization:
      strategy: min_max
      input_max: 20000.0
