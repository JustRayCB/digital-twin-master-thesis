system:
  windows: # window size definitions for rolling calculations
    small_sec: 60
    medium_sec: 300
    big_sec: 900
  weights: # Data quality scoring weights (must sum to 1.0)
    range_ok: 0.4
    roc_ok: 0.4
    stuck_ok: 0.2

templates:
  # TODO: Make an accuracy field
  dht22.temperature:
    units: "°C"
    # accuracy: 0.5 # +-0.5°C
    validation:
      range: { min: -40, max: 80 }
      roc: { max_per_minute: 5.0 } # Maximum rate of change per minute, in this case it is 5 degree Celsius per minute
      stuck: { max_flat_seconds: 14400 } # Stable room temperature can legitimately flatline for long periods
    imputation:
      strategy: window_average
      # Short gaps are better filled from recent history than by extrapolating transients
      window_seconds: 600
      min_samples: 2
      max_gap_seconds: 900
    calibration:
      strategy: identity
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 40.0
      output_min: 0.0
      output_max: 1.0
      clip: true
    smoothing:
      strategy: ewma
      alpha: 0.35

  dht22.humidity:
    units: "%"
    # accuracy: 2.0 # +-2%
    validation:
      range: { min: 0, max: 100 }
      roc: { max_per_minute: 10.0 }
      stuck: { max_flat_seconds: 3600 } # Indoor humidity can also hold steady for a while
    imputation:
      strategy: window_average
      window_seconds: 600
      min_samples: 2
      max_gap_seconds: 900
    calibration:
      strategy: identity
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 100.0
      output_min: 0.0
      output_max: 1.0
      clip: true
    smoothing:
      strategy: ewma
      alpha: 0.30

  bh1750.lux:
    units: "lux"
    # accuracy: 13107 # +-20% (13107 is 20% of 65535)
    validation:
      range: { min: 0, max: 65535 }
      roc: { max_per_minute: 1800 } # Light can change abruptly when daylight or grow lights change
      stuck:
        enabled: false
    imputation:
      strategy: forward_fill_with_decay
      # Preserve genuine step changes instead of averaging across them
      max_gap_seconds: 300
      decay_seconds: 120
      baseline: null
    calibration:
      strategy: identity
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 2000
      output_min: 0.0
      output_max: 1.0
      clip: true
    smoothing:
      strategy: pass_through

  stemma.soil_moisture:
    units: "%"
    # accuracy: 40 # +-2% (40 is 2% of 2000)
    validation:
      range: { min: 0, max: 100 } # Calibrated to percent (0-100)
      roc: { max_per_minute: 25 } # Watering can create fast steps, drying should be much slower
      stuck:
        enabled: false
    imputation:
      strategy: forward_fill_with_decay
      # Soil moisture moves slowly enough to tolerate longer brief outages
      max_gap_seconds: 3600
      decay_seconds: 1800
      baseline: null
    calibration:
      strategy: affine
      scale: 0.13986013986013987 # min 300, max 1015
      offset: -41.95804195804196
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 100.0
      output_min: 0.0
      output_max: 1.0
      clip: true
    smoothing:
      strategy: ewma
      alpha: 0.25

  camera.green_ratio:
    units: "%"
    validation:
      range: { min: 0.0, max: 100.0 }
      roc: { max_per_minute: 6.0 }
      stuck:
        enabled: false
    imputation:
      strategy: forward_fill_with_decay
      # Tolerate one missed snapshot while still decaying stale image-derived values
      max_gap_seconds: 2400
      decay_seconds: 1200
      baseline: null
    calibration:
      strategy: identity
    normalization:
      strategy: min_max
      input_min: 0.0
      input_max: 100.0
      output_min: 0.0
      output_max: 1.0
      clip: true
    smoothing:
      strategy: ewma
      alpha: 0.40

streams:
  # Example stream-level override:
  # - sensor: sensors.basil.dht22.001.temperature
  #   topic: temperature
  #   template: dht22.temperature
  #   calibration:
  #     offset: 1.5
  #   validation:
  #     range: { min: 5, max: 45 }

  - sensor: sensors.basil.dht22.001.temperature
    topic: temperature
    template: dht22.temperature

  - sensor: sensors.basil.dht22.001.humidity
    topic: humidity
    template: dht22.humidity

  - sensor: sensors.basil.bh1750.001.lux
    topic: light_intensity
    template: bh1750.lux

  - sensor: sensors.basil.stemma.001.soil_moisture
    topic: soil_moisture
    template: stemma.soil_moisture

  - sensor: sensors.basil.picamera2.001.camera_image
    topic: green_ratio
    template: camera.green_ratio
